<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Editar trajetória | Raissa Netto</title>
<link rel="stylesheet" href="css/style.css">
<style>main{padding-block:2rem} form,label{display:grid;gap:.5rem} form{max-width:36rem;margin-block:1rem} form[hidden],section[hidden]{display:none} input,select,textarea,button{font:inherit;padding:.45rem} ul li{margin-block:.5rem} button{cursor:pointer} .acesso{max-width:30rem;margin:2rem auto;padding:clamp(1.25rem,5vw,2.5rem);background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:1rem} .acesso[hidden]{display:none} .acesso-intro{color:var(--muted);margin-block:.5rem 1rem} .acesso input{width:100%;padding:.75rem;border:1px solid var(--border);border-radius:.55rem;background:var(--bg);color:var(--text)} .acesso input:focus-visible,.acesso button:focus-visible{outline:2px solid var(--accent);outline-offset:2px} .acesso form{gap:1rem} .recuperar{background:none;border:0;color:var(--accent);text-decoration:underline} #status{max-width:30rem;margin:1rem auto}</style>
<script defer src="js/admin-trajetoria.js"></script>
<main class="container">
<a href="index.html#trajetoria">← Voltar ao portfólio</a>
<h1>Editar trajetória</h1>
<p id="status" role="status"></p>
<div class="acesso" id="acesso">
<p class="section-kicker">PORTFÓLIO RAISSA NETTO</p>
<h2>Acesso administrativo</h2>
<p class="acesso-intro">Entre para gerenciar sua trajetória profissional e educacional.</p>
<form id="login">
<label>E-mail <input name="email" type="email" autocomplete="username" required></label>
<label>Senha <input name="password" type="password" autocomplete="current-password" required></label>
<button class="btn btn-primary">Entrar</button>
<button class="btn btn-outline" id="entrar-google" type="button">Entrar com Google</button>
<button class="recuperar" id="recuperar" type="button">Esqueci minha senha</button>
</form>
<form id="redefinir" hidden>
<label>Nova senha <input name="senha" type="password" minlength="8" autocomplete="new-password" required></label>
<label>Confirme a nova senha <input name="confirmacao" type="password" minlength="8" autocomplete="new-password" required></label>
<button class="btn btn-primary">Salvar nova senha</button>
</form>
</div>
<section id="painel" hidden>
<button id="sair" type="button">Sair</button>
<h2>Registros</h2>
<ul id="registros"></ul>
<h2 id="modo">Novo registro</h2>
<form id="registro">
<label>Tipo <select name="tipo"><option value="formacao">Formação</option><option value="trabalho">Trabalho</option></select></label>
<label>Título <input name="titulo" required></label>
<label>Instituição ou empresa <input name="local" required></label>
<label>Início <input name="inicio" type="date" required></label>
<label>Fim (vazio se em andamento) <input name="fim" type="date"></label>
<label>Nível <input name="nivel"></label>
<label>Carga horária <input name="horas" type="number" min="1"></label>
<label>Modalidade <select name="modalidade"><option value="">Selecione</option><option>Formal (CLT)</option><option>Informal</option><option>PJ</option><option>Autônomo e Freelancer</option><option>Trabalho Temporário</option><option>Estágio</option><option>Voluntário</option></select></label>
<label>Responsabilidades (uma por linha) <textarea name="responsabilidades"></textarea></label>
<label>Publicado <input name="publicado" type="checkbox"></label>
<button>Salvar</button>
<button id="novo" type="button">Limpar formulário</button>
</form>
</section>
</main></html>
